<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#FCE3DF"/>
    </linearGradient>
    <linearGradient id="rind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BD36A"/>
      <stop offset="1" stop-color="#3E8E3A"/>
    </linearGradient>
    <radialGradient id="flesh" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFB3BE"/>
      <stop offset="0.6" stop-color="#F5768A"/>
      <stop offset="1" stop-color="#E5536B"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#F06A80"/>
      <stop offset="1" stop-color="#D9405B"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC56B"/>
      <stop offset="1" stop-color="#2F7D3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2A38" flood-opacity="0.22"/>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- macOS-style rounded tile -->
  

  <g filter="url(#shadow)" transform="rotate(-12 512 540)">
    <!-- stem + leaf -->
    <path d="M512 262 C 510 230, 520 205, 540 188" stroke="#5B3A22" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M532 206 C 600 140, 700 150, 740 196 C 680 250, 590 262, 532 206 Z" fill="url(#leaf)"/>
    <path d="M545 205 C 610 190, 670 190, 720 197" stroke="#E9F7DC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- fruit half: rind, flesh, seed core -->
    <ellipse cx="512" cy="560" rx="262" ry="290" fill="url(#rind)"/>
    <ellipse cx="512" cy="562" rx="234" ry="262" fill="#FFF3E6"/>
    <ellipse cx="512" cy="564" rx="222" ry="250" fill="url(#flesh)"/>
    <path d="M512 410 C 610 410, 650 500, 640 575 C 630 660, 575 715, 512 715 C 449 715, 394 660, 384 575 C 374 500, 414 410, 512 410 Z" fill="url(#core)"/>

    <!-- seeds -->
    <g fill="#FFF1D6">
      <ellipse cx="470" cy="470" rx="13" ry="18" transform="rotate(-25 470 470)"/>
      <ellipse cx="555" cy="468" rx="13" ry="18" transform="rotate(25 555 468)"/>
      <ellipse cx="430" cy="545" rx="13" ry="18" transform="rotate(-10 430 545)"/>
      <ellipse cx="512" cy="520" rx="13" ry="18"/>
      <ellipse cx="594" cy="545" rx="13" ry="18" transform="rotate(10 594 545)"/>
      <ellipse cx="465" cy="610" rx="13" ry="18" transform="rotate(-20 465 610)"/>
      <ellipse cx="560" cy="612" rx="13" ry="18" transform="rotate(20 560 612)"/>
      <ellipse cx="512" cy="665" rx="13" ry="18"/>
      <ellipse cx="420" cy="625" rx="11" ry="15" transform="rotate(-30 420 625)"/>
      <ellipse cx="604" cy="625" rx="11" ry="15" transform="rotate(30 604 625)"/>
    </g>
    <!-- highlight -->
    <ellipse cx="420" cy="420" rx="60" ry="26" fill="#FFFFFF" opacity="0.28" transform="rotate(-35 420 420)"/>
  </g>
</svg>
